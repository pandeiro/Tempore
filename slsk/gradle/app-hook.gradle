// Applied from the end of app/build.gradle (seam S2).
// - wires :slsk:ui (+ its transitive :slsk:core) into every variant
// - adds slsk/app-glue sources + resources to the app module (HostBridge, branding overlay)
// - rebrands: applicationId com.github.pandeiro.tempore.*, versionName/Code -tempore.N
// Setting ids is done here (still during evaluation); afterEvaluate is too late in AGP 9.
def slskRoot = new File(rootDir, 'slsk')
def temporeSuffix = '.tempore'
def temporeRc = 1

android {
    sourceSets {
        main {
            java.srcDirs += [new File(slskRoot, 'app-glue/src')]
            kotlin.srcDirs += [new File(slskRoot, 'app-glue/src')]
            res.srcDirs += [new File(slskRoot, 'app-glue/res')]
        }
    }
}

def baseCode = android.defaultConfig.versionCode
def baseName = android.defaultConfig.versionName ?: ''

android.productFlavors.all { flavor ->
    switch (flavor.name) {
        case 'tempus':
            flavor.applicationId = "com.github.pandeiro${temporeSuffix}"
            break
        case 'degoogled':
            flavor.applicationId = "com.github.pandeiro${temporeSuffix}.degoogled"
            break
        case 'play':
            flavor.applicationId = "com.github.pandeiro${temporeSuffix}.play"
            break
        default:
            break
    }
}

android.defaultConfig {
    versionCode (baseCode * 100 + temporeRc)
    versionName "${baseName}-tempore.${temporeRc}"
}

// Release signing: when slsk/keystore/local.properties exists (gitignored), sign
// release builds with the fork's own key; otherwise upstream behaviour (unsigned)
// is unchanged.
def ksProps = new File(slskRoot, 'keystore/local.properties')
if (ksProps.exists()) {
    def ks = new Properties()
    ksProps.withInputStream { ks.load(it) }
    def ksStore = new File(rootDir, ks.getProperty('storeFile'))
    if (ksStore.exists()) {
        android.signingConfigs {
            tempore {
                storeFile ksStore
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
        android.buildTypes.release.signingConfig = android.signingConfigs.tempore
    }
}

dependencies {
    implementation project(':slsk:ui')
}
